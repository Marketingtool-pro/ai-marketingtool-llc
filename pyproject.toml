[project]
name = "ai-marketingtool-llc"
version = "0.1.0"
description = "Control-plane helpers for the Marketingtool-pro project."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    {name = "Marketingtool-pro",email = "help@marketingtool.pro"},
]
keywords = ["marketingtool", "control-plane", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["uv>=0.12.1"]

[project.urls]
Homepage = "https://github.com/Marketingtool-pro/ai-marketingtool-llc"
Repository = "https://github.com/Marketingtool-pro/ai-marketingtool-llc"
Issues = "https://github.com/Marketingtool-pro/ai-marketingtool-llc/issues"

[dependency-groups]
dev = [
    "pre-commit>=3.3.3",
    "pytest>=8",
    "pytest-dotenv>=0.5.2",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

# Update this exact section in your pyproject.toml:
[tool.pdm.build]
package-dir = "src"
uv = true
includes = ["src/ai_marketingtool_llc"]


[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.tox]
env_list = ["py312"]

[tool.tox.env_run_base]
pass_env = ["MY_AUTH_TOKEN"]
deps = ["pytest", "pytest-dotenv", "requests"]
commands = [["pytest"]]
