[project]
name = "ai-marketingtool-llc"
version = "0.1.0"
description = "Control-plane helpers for the Marketingtool-pro project."
readme = "README-pypi.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    {name = "Marketingtool-pro",email = "help@marketingtool.pro"},
]
keywords = ["marketingtool", "control-plane", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.10.9",
    "mcp[cli]>=2.1.1",
    "scipy>=1.15.3",
    "quart-schema (>=0.25.0,<0.26.0)",
    "databricks-sdk (>=0.135.0,<0.136.0)",
    "pendulum @ git+https://github.com/sdispater/pendulum.git",
    "requests[security,socks] (>=2.34.2,<3.0.0)",
]

[project.urls]
Homepage = "https://github.com/Marketingtool-pro/ai-marketingtool-llc"
Repository = "https://github.com/Marketingtool-pro/ai-marketingtool-llc"
Issues = "https://github.com/Marketingtool-pro/ai-marketingtool-llc/issues"

[dependency-groups]
dev = [
    "pre-commit>=3.3.3",
    "pytest>=8",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

# The npm package (@marketingtool-pro/ai-marketingtool-llc) ships "src", so the
# Python module deliberately lives outside src/ to keep the two packaging
# systems from shipping each other's files. See package.json "files".
[tool.pdm]
distribution = false

[tool.pdm.build]
includes = ["ai_marketingtool_llc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.workspace]
members = [
    "mcp-on-cloudrun",
    "AiMarketingtool-pro-fbaf2fad/try-scipy",
]
