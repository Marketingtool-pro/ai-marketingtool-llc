name: OSV-Scanner

on:
  pull_request:
    branches: [ "Master" ]
  merge_group:
    branches: [ "Master" ]
  schedule:
    - cron: '31 8 * * 3'
  push:
    branches: [ "Master" ]

permissions:
  # The reusable workflow requests actions: read; a caller must grant it or
  # GitHub rejects the run before any job starts.
  actions: read
  security-events: write
  contents: read

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36" # v2.7.0
    with:
      # osv-scanner v2 removed the old git-skip flag; git roots are skipped by default
      scan-args: |-
        --config=osv-scanner.toml
        -r
        ./

  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36" # v2.7.0
    with:
      # No --config here: this job also scans the target branch, which may not
      # have osv-scanner.toml, and it only reports vulns new to this PR anyway.
      scan-args: |-
        -r
        ./

  osv-scan:
    name: OSV-Scanner Scan
    runs-on: ubuntu-24.04 # Pinning to 24.04 clears the ubuntu-latest warning
    steps:
      # 1. Repository Checkout (Pinned to v4.2.2)
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # 2. Run the OSV-Scanner Action directly (Pinned to v2.6.0)
      - name: Run OSV-Scanner
        continue-on-error: true # vulnerabilities found should still upload the report
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36
        with:
          scan-args: |-
            --format=sarif
            --output-file=results.sarif
            --config=osv-scanner.toml
            -r
            ./

      # 3. Upload Results to GitHub Security Tab (Pinned to v3.28.10)
      - name: Upload SARIF report
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: results.sarif
