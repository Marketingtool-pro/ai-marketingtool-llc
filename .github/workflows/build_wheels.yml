name: Build Wheels

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13' # Recommended: Pin a specific version for consistency

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        # If needed, filter platforms per runner using environment variables:
        # env:
        #   CIBW_ARCHS_LINUX: x86_64 # For ubuntu-latest
        #   CIBW_ARCHS_MACOS: x86_64 arm64 universal2

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-${{ matrix.os }} # Simplified readable name
          path: ./wheelhouse/*.whl          # Fixed the typo here (.whlx -> .whl)Fixes #
