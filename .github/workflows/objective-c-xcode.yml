name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    # Was `[self-hosted, macOS, X64]`. No self-hosted runner is registered to
    # this repository: the org's only runner (`Loken-Mac`, macOS/ARM64) is
    # registered to Marketingtool-pro/AiMarketingtool-pro-fbaf2fad, per its
    # launchd service name, and would not have matched the X64 label regardless.
    # So this job queued forever and never built. Only
    # Standard GitHub-hosted runners are available, so use the hosted macOS
    # image, which provides the Xcode toolchain and `xcodebuild` this job needs.
    # The steps below also pipe through `xcpretty`; that is not a guaranteed part
    # of the runner image, so the Build step installs it rather than assuming it.
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Build
        env:
          scheme: ${{ 'default' }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild clean build analyze -scheme "$scheme" -"$filetype_parameter" "$file_to_build" | xcpretty && exit ${PIPESTATUS[0]}
