name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    # Was `[self-hosted, macOS, X64]`. No self-hosted runner matching those
    # labels is available to this repository, so nothing could claim the job
    # and it queued indefinitely. Use the GitHub-hosted macOS image, which
    # provides the Xcode toolchain and `xcodebuild` these steps need.
    #
    # This also drops the explicit X64 constraint. No working build changes,
    # because no runner ever satisfied the old label. If this project later
    # needs a specific architecture or Xcode version, pin an explicit runner
    # image instead of macos-latest; GitHub's runner-images documentation
    # records what each label currently maps to.
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
      # The Build step pipes through xcpretty. It is usually present on the
      # hosted image but is not guaranteed, so fall back to installing it.
      # A user-scoped install avoids both the non-writable system gem
      # directory and mutating the runner's system Ruby.
      - name: Ensure xcpretty is available
        run: |
          set -euo pipefail
          if ! command -v xcpretty >/dev/null 2>&1; then
            gem install --user-install xcpretty --no-document
            echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"
          fi

      - name: Build
        env:
          scheme: ${{ 'default' }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild clean build analyze -scheme "$scheme" -"$filetype_parameter" "$file_to_build" | xcpretty && exit ${PIPESTATUS[0]}
