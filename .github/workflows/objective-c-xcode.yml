name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    # Was `[self-hosted, macOS, X64]`. No self-hosted runner is registered to
    # this repository - the organisation's only one is registered to another
    # repository and is ARM64, so it would not have matched X64 either way.
    # Nothing could claim that label, and the job queued indefinitely. Use the
    # GitHub-hosted macOS image, which provides the Xcode toolchain and
    # `xcodebuild` these steps need.
    #
    # This drops the explicit X64 constraint: macos-latest currently resolves
    # to Apple Silicon. No working build is being changed, because no runner
    # ever satisfied the old label - but if this project later needs x86_64,
    # pin an Intel image (macos-13) rather than relying on macos-latest.
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
      # The Build step pipes through xcpretty. It is usually present on the
      # hosted image but is not guaranteed, so fall back to installing it.
      # sudo avoids the non-writable default gem directory on hosted runners.
      - name: Ensure xcpretty is available
        run: command -v xcpretty >/dev/null || sudo gem install xcpretty --no-document

      - name: Build
        env:
          scheme: ${{ 'default' }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild clean build analyze -scheme "$scheme" -"$filetype_parameter" "$file_to_build" | xcpretty && exit ${PIPESTATUS[0]}
