# Publishes the Python distribution `ai-marketingtool-llc`.
#
# Uses PyPI Trusted Publishing (OIDC) -- there is no API token to store. The
# publisher must be registered once on the target index before this can succeed:
#   https://test.pypi.org/manage/account/publishing/
# with: owner=Marketingtool-pro, repo=ai-marketingtool-llc,
#       workflow=publish-pypi.yml, environment=testpypi
#
# Third-party actions are pinned to full commit SHAs to satisfy the org Actions
# policy. They must also be allow-listed at the org level, since none are owned
# by Marketingtool-pro.
name: Publish Python distribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to TestPyPI (unchecked = build and verify only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 

      # astral-sh/setup-uv@v5.3.1 (Latest stable v5 recommended)
      - uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run tests
        run: uv run --group dev pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Verify distribution metadata
        run: uvx twine check dist/*

      # actions/upload-artifact@v4.6.1
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    # Only on a published release, or an explicit opt-in dispatch. Never on a
    # bare build run.
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      # actions/download-artifact@v4.1.9 (Note: Must match upload-artifact major version v4!)
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c 
        with:
          name: release-dists
          path: dist/

      # pypa/gh-action-pypi-publish@v1.12.4
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 
        with:
          repository-url: https://test.pypi.org/legacy/
