name: ci

on:
  push:
    branches:
      - "master" # Enforce lowercase if your branch is 'master'

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04 # Fixed to remove the ubuntu-latest warning
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # If secrets are configured correctly in GitHub, this will now pass
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      # Using Docker Build Cloud
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "marketingtool/marketingtool"

      # Build and push to your registry
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          tags: "${{ vars.DOCKER_USER }}/docker-build-cloud-demo:latest"
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}
