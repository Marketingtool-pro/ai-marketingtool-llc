<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarketingTool Agent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:16px 24px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:12px}
header h1{font-size:18px;font-weight:700;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header span{font-size:12px;color:#64748b;padding:2px 8px;border:1px solid rgba(255,255,255,0.1);border-radius:12px}
#messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:800px;width:100%;margin:0 auto;display:flex;gap:12px}
.msg.user{justify-content:flex-end}
.avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.msg.assistant .avatar{background:rgba(99,102,241,0.15);color:#6366f1}
.msg.user .avatar{background:rgba(255,255,255,0.08);color:#94a3b8}
.bubble{padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;border-radius:16px 16px 4px 16px}
.msg.assistant .bubble{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:16px 16px 16px 4px}
#input-area{padding:16px 24px;border-top:1px solid rgba(255,255,255,0.06);background:rgba(0,0,0,0.3)}
#input-box{max-width:800px;margin:0 auto;display:flex;gap:8px;padding:8px 12px;border-radius:16px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);transition:border-color 0.2s}
#input-box:focus-within{border-color:rgba(99,102,241,0.4);box-shadow:0 0 0 3px rgba(99,102,241,0.08)}
#prompt{flex:1;background:none;border:none;color:#e2e8f0;font-size:14px;outline:none;resize:none;font-family:inherit;max-height:120px}
#prompt::placeholder{color:#475569}
#send{width:40px;height:40px;border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
#send.active{background:#6366f1;color:#fff}
#send.inactive{background:rgba(255,255,255,0.04);color:#334155}
#send:disabled{opacity:0.5;cursor:not-allowed}
.typing{display:flex;gap:4px;padding:8px 16px}.typing span{width:6px;height:6px;border-radius:50%;background:#6366f1;animation:bounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:0.2s}.typing span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
</style>
</head>
<body>
<header>
<h1>MarketingTool Agent</h1>
<span>Claude Opus 4.6</span>
</header>
<div id="messages"></div>
<div id="input-area">
<div id="input-box">
<textarea id="prompt" rows="1" placeholder="Ask anything — users, payments, errors, deployments..."></textarea>
<button id="send" class="inactive" disabled>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
</button>
</div>
</div>
<script>
const msgs=document.getElementById('messages'),input=document.getElementById('prompt'),btn=document.getElementById('send');
let loading=false;
function esc(s){const d=document.createElement('div');d.textContent=s;return d.textContent;}
function addMsg(role,text){
const d=document.createElement('div');d.className='msg '+role;
const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;
const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=role==='assistant'?'AI':'You';
if(role==='assistant'){d.appendChild(avatar);d.appendChild(bubble);}
else{d.appendChild(bubble);d.appendChild(avatar);}
msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}
function showTyping(){const d=document.createElement('div');d.className='msg assistant';d.id='typing';
const av=document.createElement('div');av.className='avatar';av.textContent='AI';
const t=document.createElement('div');t.className='typing';
for(let i=0;i<3;i++){const s=document.createElement('span');t.appendChild(s);}
d.appendChild(av);d.appendChild(t);msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}
function removeTyping(){const t=document.getElementById('typing');if(t)t.remove();}
input.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';
const has=this.value.trim();btn.className=has?'active':'inactive';btn.disabled=!has||loading;});
input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
btn.addEventListener('click',send);
async function send(){const text=input.value.trim();if(!text||loading)return;
loading=true;btn.disabled=true;btn.className='inactive';addMsg('user',text);input.value='';input.style.height='auto';
showTyping();
try{const r=await fetch('/agent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text})});
const d=await r.json();removeTyping();
if(d.response)addMsg('assistant',d.response);else if(d.error)addMsg('assistant','Error: '+d.error);
else addMsg('assistant',JSON.stringify(d));}
catch(e){removeTyping();addMsg('assistant','Error: '+e.message);}
loading=false;const has=input.value.trim();btn.className=has?'active':'inactive';btn.disabled=!has;input.focus();}
input.focus();
</script>
</body>
</html>
